# Deploy from the repository root. See docs/DEPLOYMENT-RENDER.md.
services:
  - type: web
    name: kristian-salmeron-web
    runtime: static
    buildCommand: npx --yes pnpm@11.22.0 install --frozen-lockfile --prod=false && npx --yes pnpm@11.22.0 --filter @kristian/web build
    staticPublishPath: apps/web/out
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: SKIP_INSTALL_DEPS
        value: 'true'
      - key: NEXT_PUBLIC_ANALYTICS_ORIGIN
        value: https://analytics.kristiansalmeron.com

  - type: web
    name: kristian-salmeron-api
    runtime: node
    # Owner-approved always-on API; retain browser retries for transient failures.
    plan: 0.5c-512mb
    region: oregon
    domains:
      - analytics.kristiansalmeron.com
    buildCommand: npx --yes pnpm@11.22.0 install --frozen-lockfile --prod=false && npx --yes pnpm@11.22.0 --filter @kristian/api... build
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.23.2
      - key: NODE_ENV
        value: production
      - key: SKIP_INSTALL_DEPS
        value: 'true'
      - key: ANALYTICS_ORIGIN
        value: https://analytics.kristiansalmeron.com
      - key: ANALYTICS_OWNER_EMAIL
        sync: false
      - key: ANALYTICS_HASH_SECRET
        generateValue: true
      - key: ANALYTICS_SETUP_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kristian-salmeron-analytics-db
          property: connectionString

databases:
  - name: kristian-salmeron-analytics-db
    plan: 0.1c-256mb
    region: oregon
    postgresMajorVersion: '18'
    diskSizeGB: 1
    ipAllowList: []
