# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
previews:
  generation: 'off'
projects:
  - name: Portfolio Staging
    environments:
      - name: staging
        services:
          - type: web
            name: kristian-salmeron-web-staging
            runtime: static
            buildCommand: >-
              npx --yes pnpm@11.22.0 install --frozen-lockfile --prod=false && npx --yes pnpm@11.22.0 --filter
              @kristian/web build
            staticPublishPath: apps/web/out
            branch: staging
            autoDeployTrigger: checksPass
            buildFilter:
              paths:
                - apps/web/**
                - packages/**
                - package.json
                - pnpm-lock.yaml
                - pnpm-workspace.yaml
                - .node-version
                - .npmrc
                - tsconfig*.json
                - scripts/**
                - render.staging.yaml
            routes:
              - type: redirect
                source: /facebook
                destination: /?utm_source=facebook&utm_medium=social&utm_campaign=portfolio
              - type: redirect
                source: /facebook/
                destination: /?utm_source=facebook&utm_medium=social&utm_campaign=portfolio
              - type: redirect
                source: /instagram
                destination: /?utm_source=instagram&utm_medium=social&utm_campaign=portfolio
              - type: redirect
                source: /instagram/
                destination: /?utm_source=instagram&utm_medium=social&utm_campaign=portfolio
              - type: redirect
                source: /linkedin
                destination: /?utm_source=linkedin&utm_medium=social&utm_campaign=portfolio
              - type: redirect
                source: /linkedin/
                destination: /?utm_source=linkedin&utm_medium=social&utm_campaign=portfolio
              - type: redirect
                source: /tiktok
                destination: /?utm_source=tiktok&utm_medium=social&utm_campaign=portfolio
              - type: redirect
                source: /tiktok/
                destination: /?utm_source=tiktok&utm_medium=social&utm_campaign=portfolio
              - type: redirect
                source: /whatsapp
                destination: /?utm_source=whatsapp&utm_medium=messaging&utm_campaign=portfolio
              - type: redirect
                source: /whatsapp/
                destination: /?utm_source=whatsapp&utm_medium=messaging&utm_campaign=portfolio
              - type: redirect
                source: /github
                destination: /?utm_source=github&utm_medium=social&utm_campaign=portfolio
              - type: redirect
                source: /github/
                destination: /?utm_source=github&utm_medium=social&utm_campaign=portfolio
            envVars:
              - key: NODE_VERSION
                value: 22.23.2
              - key: SKIP_INSTALL_DEPS
                value: 'true'
              - key: NEXT_PUBLIC_ANALYTICS_ORIGIN
                value: https://kristian-salmeron-api-staging.onrender.com
            domains:
              - staging.kristiansalmeron.com
            headers:
              - path: /*
                name: X-Robots-Tag
                value: noindex, nofollow, noarchive
          - type: web
            name: kristian-salmeron-api-staging
            runtime: node
            plan: 0.5c-512mb
            region: virginia
            domains:
              - analytics.staging.kristiansalmeron.com
            buildCommand: >-
              npx --yes pnpm@11.22.0 install --frozen-lockfile --prod=false && npx --yes pnpm@11.22.0 --filter
              @kristian/api... build
            startCommand: node apps/api/dist/server.js
            healthCheckPath: /api/v1/health
            branch: staging
            autoDeployTrigger: checksPass
            buildFilter:
              paths:
                - apps/api/**
                - packages/**
                - package.json
                - pnpm-lock.yaml
                - pnpm-workspace.yaml
                - .node-version
                - .npmrc
                - tsconfig*.json
                - scripts/**
                - render.staging.yaml
            envVars:
              - key: NODE_VERSION
                value: 22.23.2
              - key: NODE_ENV
                value: production
              - key: SKIP_INSTALL_DEPS
                value: 'true'
              - key: ANALYTICS_OWNER_EMAIL
                sync: false
              - key: ANALYTICS_HASH_SECRET
                generateValue: true
              - key: ANALYTICS_SETUP_TOKEN
                generateValue: true
              - key: ANALYTICS_ORIGIN
                value: https://kristian-salmeron-api-staging.onrender.com
              - key: APP_ENV
                value: staging
              - key: DATABASE_URL
                fromDatabase:
                  name: kristian-salmeron-analytics-db-staging
                  property: connectionString
        databases:
          - name: kristian-salmeron-analytics-db-staging
            plan: 0.1c-256mb
            region: virginia
            postgresMajorVersion: '18'
            diskSizeGB: 1
            ipAllowList: []
            databaseName: portfolio_staging
            user: portfolio_staging
