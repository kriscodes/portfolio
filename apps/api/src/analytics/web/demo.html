<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Explore the Studio Insights dashboard with synthetic traffic across Portfolio, Lab, and Toolbox."
    />
    <title>Studio Insights demo — Kristian Salmeron</title>
    <link rel="stylesheet" href="/analytics-assets/styles.css" />
    <script src="/analytics-assets/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#dashboard-main">Skip to content</a>
    <div class="workspace">
      <header class="topbar">
        <a class="brand" href="https://kristiansalmeron.com/work/">
          <span class="brand-mark" aria-hidden="true">ks.</span>
          <span class="brand-name">KRISTIAN SALMERON<span>BACK TO SELECTED WORK</span></span>
        </a>
        <div class="top-actions">
          <button
            class="theme-button"
            type="button"
            id="theme-toggle"
            aria-label="Switch to After Hours appearance"
          >
            After Hours <span aria-hidden="true">◐</span>
          </button>
        </div>
      </header>
      <noscript
        ><p class="noscript-note">Enable JavaScript to explore the sample reports.</p></noscript
      >
      <div class="dashboard-shell demo-dashboard" id="dashboard">
        <main class="dashboard-main" id="dashboard-main">
          <!-- overview -->
        </main>
      </div>
      <footer class="workspace-footer">
        <span>STUDIO INSIGHTS DEMO</span><span>PORTFOLIO / LAB / TOOLBOX</span>
      </footer>
    </div>
    <!-- demo:reports -->
  </body>
</html>
